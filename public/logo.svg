<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Group for Logo Icon -->
  <g transform="translate(10, 10)">
    <!-- Circuit lines on the left -->
    <path d="M 25 35 L 45 35" stroke="url(#greenGrad)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="23" cy="35" r="4.5" fill="#34d399" />
    
    <path d="M 40 50 L 55 50" stroke="url(#greenGrad)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="38" cy="50" r="4.5" fill="#34d399" />
    
    <path d="M 25 65 L 55 65" stroke="url(#greenGrad)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="23" cy="65" r="4.5" fill="#34d399" />
    
    <path d="M 35 80 L 65 80" stroke="url(#greenGrad)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="33" cy="80" r="4.5" fill="#34d399" />

    <!-- Hexagon Outline -->
    <!-- Center of hexagon is at (90, 50), size ~ 45 -->
    <polygon points="90,8 129,30 129,75 90,97 51,75 51,30" 
             fill="none" 
             stroke="url(#greenGrad)" 
             stroke-width="7" 
             stroke-linejoin="round" />

    <!-- Robot Face -->
    <g transform="translate(90, 42)">
      <!-- Antenna -->
      <line x1="0" y1="-22" x2="0" y2="-12" stroke="url(#greenGrad)" stroke-width="3.5" />
      <circle cx="0" cy="-24" r="4" fill="#34d399" />
      <!-- Head -->
      <rect x="-18" y="-12" width="36" height="24" rx="10" fill="none" stroke="url(#checkGrad)" stroke-width="4" />
      <!-- Eyes -->
      <ellipse cx="-7" cy="0" rx="3.5" ry="2" fill="#0f172a" />
      <ellipse cx="7" cy="0" rx="3.5" ry="2" fill="#0f172a" />
    </g>

    <!-- Overlapping Checkmark -->
    <path d="M 75 52 L 92 68 L 138 35" 
          fill="none" 
          stroke="url(#checkGrad)" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <!-- "Testrix" Text -->
  <text x="170" y="72" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="#0f172a" letter-spacing="-1">
    Testri<tspan fill="#10b981">x</tspan>
  </text>

  <!-- Subtitle "AI TEST AUTOMATION" -->
  <text x="172" y="96" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#10b981" letter-spacing="4.5">
    AI TEST AUTOMATION
  </text>
</svg>